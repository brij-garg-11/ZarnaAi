[pytest]
# Operator-service tests. Run from THIS directory so `import app` resolves to
# operator/app (it collides with the main app's app/ package):
#
#     cd operator && python -m pytest tests/
#
# Requires a Postgres at DATABASE_URL (defaults to the local docker test DB on
# port 55432 — see tests/conftest.py).
testpaths = tests
